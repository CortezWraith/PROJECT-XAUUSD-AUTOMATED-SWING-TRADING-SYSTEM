# XAUUSD swing system - PAPER stage configuration (frozen research spec, see research/frozen_spec.json)
#
# Status: no strategy passed all pre-registered robustness gates. This configuration is only
# allowed to run in PAPER mode (simulated fills on live MT5 quotes) or on a DEMO account.
# Credentials are read from environment variables: MT5_LOGIN, MT5_PASSWORD, MT5_SERVER, MT5_PATH.

[system]
symbol = "XAUUSD"
initial_capital = 100000.0
state_dir = "state"
log_path = "logs/system.log"
poll_seconds = 5.0
max_quote_age_s = 30.0

[broker]
type = "mt5"
# broker server time minus (New York + 7h). 0 for GMT+2/+3 "New York close" brokers.
server_offset_hours = 0
deviation_points = 30

[risk]
# one economic bet (H4 trend) -> one risk budget: 0.5% per trade split 1/3 per strategy
risk_per_trade = 0.005
strategy_risk_weights = { ema_trend_h4 = 0.3333, donchian_h4 = 0.3333, squeeze_h4 = 0.3333 }
max_open_risk = 0.015
max_gross_notional_x_equity = 3.0
max_daily_loss = 0.02
max_weekly_loss = 0.04
strategy_dd_stop = 0.10
portfolio_dd_stop = 0.15
max_spread_bps = 6.0
enforce_loss_limits = true

# Ranked candidates (frozen before the holdout). All three are the same underlying bet.
[[strategies]]
class = "tradingsystem.strategies.trend.EmaTrend"
enabled = true
params = { fast = 20, slow = 100, atr_n = 20, stop_atr = 3.0 }

[[strategies]]
class = "tradingsystem.strategies.trend.DonchianBreakout"
enabled = true
params = { entry_n = 55, exit_n = 20, atr_n = 20, stop_atr = 2.0, max_hold = 90 }

[[strategies]]
class = "tradingsystem.strategies.breakout.SqueezeBreakout"
enabled = true
params = { bb_n = 20, bb_k = 2.0, rank_n = 120, squeeze_pct = 0.2, lookback = 5, atr_n = 20, stop_atr = 2.0, max_hold = 30 }

# Rejected candidates kept for reference (never enable without a new research cycle):
#   tradingsystem.strategies.session.AsiaLondonSession   (cost-dominated, decaying)
#   tradingsystem.strategies.meanrev.TrendPullbackRSI    (negative before costs)
#   tradingsystem.strategies.trend.MacroFilteredDonchian (needs live USD index; OOS ~0)

[promotion]
# set only when the SMALL LIVE gate in REPORT.md section 22 has been passed and signed off
small_live_approved_on = ""
